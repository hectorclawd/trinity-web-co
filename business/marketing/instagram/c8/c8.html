<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"es","label":"Español"}]},
    {"id":"guides","type":"boolean","label":"Show safe zones","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <!-- C8 · What $99 a month actually covers: a 9-slide carousel (1080×1350), one slide per second.
         Slide text is the plan's ("Carousel scripts", C8, Straight answers); what each care plan
         includes is playbook §3. Every plan name and price, the CTA and the languages line come from
         config.ts. English only for now: the Spanish copy gets added once Hector checks it.
         Render: npm run piece -- c8/c8.html --lang en --still -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="brand/generated.js"></script>
    <script src="brand/kit.js"></script>
    <link rel="stylesheet" href="brand/kit.css" />
    <style>
      @font-face {
        font-family: "Archivo Variable";
        src: url("brand/fonts/archivo-latin-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Archivo Variable";
        src: url("brand/fonts/archivo-latin-ext-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--limestone);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--font);
      }
      #el-frame {
        position: absolute;
        inset: 0;
      }
      .c8-slide {
        position: absolute;
        inset: 0;
      }
      /* Each slide's content sits in the frame's content box: 88 px sides, from 236 px down */
      .c8-body {
        position: absolute;
        left: var(--pad);
        right: var(--pad);
        top: 236px;
      }
      .c8-body > * {
        margin: 0;
      }
      .c8-nowrap {
        white-space: nowrap;
      }
      /* The river spans the 88 px margins (904 px), so its neighborhood labels stay inside them */
      .c8-river {
        position: absolute;
        left: var(--pad);
        top: 896px;
        width: 904px;
      }
      .c8-river svg {
        display: block;
      }

      /* 1 · Cover, laid out like C2's: the hook, the plan name under it, the river below as a still */
      /* Display's 0.93 leading would let descenders touch the line under them */
      .c8-title {
        max-width: 904px;
        line-height: 1.02;
        text-wrap: balance;
      }
      /* The plan's name in Title, the ramp's step for package and plan names (DESIGN.md) */
      .c8-plan-name {
        margin-top: 40px;
      }

      /* 2–7 · What's covered: the number in a River circle, the item, then what it means under the rule */
      .c8-num {
        display: grid;
        place-items: center;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--river);
        color: var(--paper);
        font-size: var(--fs-lead);
        line-height: 1;
        font-weight: 820;
        font-stretch: 116%;
        font-variant-numeric: lining-nums;
      }
      .c8-item {
        margin-top: 48px;
        max-width: 904px;
        line-height: 1.04;
        text-wrap: balance;
      }
      .c8-line {
        margin-top: 56px;
        padding-top: 40px;
        border-top: var(--rule) solid var(--ink);
        max-width: 880px;
        text-wrap: pretty;
      }

      /* 8 · The other two plans: each question as a headline, the plan and its price, then one plain line */
      .c8-other {
        max-width: 880px;
      }
      .c8-other + .c8-other {
        margin-top: 64px;
        padding-top: 56px;
        border-top: var(--rule) solid var(--ink);
      }
      .c8-ask {
        max-width: 904px;
        line-height: 1.04;
      }
      .c8-pick {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 0.4em;
        margin-top: 24px;
        font-weight: 720;
      }
      .c8-price {
        color: var(--river-deep);
        font-weight: 820;
        font-variant-numeric: lining-nums proportional-nums;
      }
      .c8-what {
        margin-top: 16px;
        max-width: 880px;
      }

      /* 9 · CTA, as C1's slide 7: the keyword is a river message bubble, the river closes the carousel */
      .c8-cta {
        max-width: 904px;
        text-wrap: balance;
      }
      .c8-ask-dm {
        margin-top: 28px;
      }
      .c8-ask-dm .twc-bubble {
        margin-left: 0.18em;
      }
      .c8-langs {
        margin-top: 44px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="c8" data-start="0" data-duration="9" data-width="1080" data-height="1350">
      <div
        id="el-frame"
        data-composition-id="carousel-slide"
        data-composition-src="compositions/carousel-slide.html"
        data-variable-values='{"tone":"light","swipe":1}'
        data-start="0"
        data-duration="9"
        data-track-index="0"
        data-width="1080"
        data-height="1350"
      ></div>

      <section id="c8-s1" class="clip c8-slide" data-start="0" data-duration="1" data-track-index="1">
        <div class="c8-body">
          <h1 class="c8-title t-display"></h1>
          <p class="c8-plan-name t-title"></p>
        </div>
        <div class="c8-river"></div>
      </section>

      <section id="c8-s2" class="clip c8-slide c8-covered" data-item="0" data-start="1" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>
      <section id="c8-s3" class="clip c8-slide c8-covered" data-item="1" data-start="2" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>
      <section id="c8-s4" class="clip c8-slide c8-covered" data-item="2" data-start="3" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>
      <section id="c8-s5" class="clip c8-slide c8-covered" data-item="3" data-start="4" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>
      <section id="c8-s6" class="clip c8-slide c8-covered" data-item="4" data-start="5" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>
      <section id="c8-s7" class="clip c8-slide c8-covered" data-item="5" data-start="6" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>

      <section id="c8-s8" class="clip c8-slide" data-start="7" data-duration="1" data-track-index="1">
        <div class="c8-body"></div>
      </section>

      <section id="c8-s9" class="clip c8-slide" data-start="8" data-duration="1" data-track-index="1">
        <div class="c8-body">
          <p class="c8-cta t-display"></p>
          <p class="c8-ask-dm t-headline"></p>
          <p class="c8-langs t-label t-muted"></p>
        </div>
        <div class="c8-river"></div>
      </section>
    </div>
    <script>
      // Slide text from the plan. What each plan includes is playbook §3; the plan names and prices come
      // from config.ts (carePlans), as do the CTA and the languages line. Of the plan's allowed extra
      // facts, this uses one: replies within 1 business day on Care Standard (slide 5). Slide 8's lines
      // are the edit time, posts and pages that set the other two plans apart, from the same §3 table.
      // English only for now: add `es` once Hector has checked the Spanish slide text.
      // `keep` lists words that stay together on one line (a name, or a hyphenated word).
      const COPY = {
        en: {
          cover: (price) => `What ${price} a month actually covers`,
          covered: [
            {
              head: "Hosting, SSL and uptime monitoring",
              line: "We host your site, keep the padlock that shows it’s secure, and get an alert if it ever goes down.",
            },
            {
              head: "Forms and booking tested every month",
              keep: ["every month"],
              line: "We make sure messages and bookings from your site still reach you.",
            },
            {
              head: "Security updates and backups",
              line: "We keep the code behind your site up to date and save a copy we can restore if anything goes wrong.",
              lineKeep: ["up to date"],
            },
            {
              head: "1 hour of edits a month",
              keep: ["a month"],
              line: "Send us new text, photos, hours or prices, and we reply within 1 business day.",
            },
            {
              head: "A one-page monthly report",
              keep: ["one-page"],
              line: "One email each month with how many visits, calls and form messages your site got.",
            },
            {
              head: "2 Google posts a month",
              keep: ["a month"],
              line: "We post them on your Google Business Profile, the listing people see on Search and Maps.",
              lineKeep: ["Google Business Profile"],
            },
          ],
          others: [
            { id: "essential", ask: "Need less?", what: "The same hosting, form checks and updates, with 30 minutes of edits a month." },
            { id: "plus", ask: "Need more?", what: "3 hours of edits, 4 Google posts, and a new service page or blog post a month.", keep: ["service page"] },
          ],
        },
      };

      const { lang } = TWC.init(window.__hyperframes.getVariables());
      if (!COPY[lang]) throw new Error(`C8 has no "${lang}" copy yet. Add it once Hector has checked the slide text.`);
      const copy = COPY[lang];
      const $ = (s, root = document) => root.querySelector(s);
      const fill = (node, text) => ((node.textContent = text), node);
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      };
      // No-break spaces keep a number on the line with the word after it ("1 business", never
      // "1 / business") and the last two words together, so a line never ends on one word (S3's keep)
      const NBSP = String.fromCharCode(160);
      const keep = (text, words = []) => {
        words.forEach((w) => (text = text.split(w).join(w.replace(/ /g, NBSP))));
        return text.replace(/(\d)\s+/g, "$1" + NBSP).replace(/\s+(\S+)$/, NBSP + "$1");
      };
      // Headline text with a number kept with its word, and some words kept on one line (so "one-page"
      // never splits at its hyphen)
      const fillKeeping = (node, text, words = []) => {
        text = text.replace(/(\d)\s+/g, "$1" + NBSP);
        if (!words.length) return fill(node, text);
        const pattern = new RegExp(`(${words.map((w) => w.replace(/[-]/g, "\\-")).join("|")})`, "g");
        text.split(pattern).forEach((part) => {
          if (!part) return;
          node.append(words.includes(part) ? make("span", "c8-nowrap", part) : part);
        });
        return node;
      };
      // TWC.fit only measures height, so a single wide word could still run past the margin:
      // step the size down until nothing is wider than the box (as C6 does)
      const fitWidth = (node, min) => {
        let size = parseFloat(node.style.fontSize);
        while (size > min && node.scrollWidth > node.clientWidth) node.style.fontSize = `${(size -= 2)}px`;
      };

      // The plan this carousel is about, and the other two, all from config.ts
      const plans = TWC.t("carePlans");
      const plan = (id) => {
        const found = plans.find((p) => p.id === id);
        if (!found) throw new Error(`C8: config.ts has no "${id}" care plan`);
        return found;
      };
      const standard = plan("standard");

      // 1 · Cover: the hook with the price, the plan's name under it
      const title = fill($("#c8-s1 .c8-title"), copy.cover(TWC.price(standard.monthly)));
      fill($("#c8-s1 .c8-plan-name"), standard.name);
      TWC.showRiver(TWC.river($("#c8-s1 .c8-river"), { width: 904, stops: "phone" }));

      // 2–7 · What's covered, numbered by their place in the list (a real count, 1 to 6)
      const coveredSlides = [...document.querySelectorAll(".c8-covered")];
      if (coveredSlides.length !== copy.covered.length) throw new Error("C8: one slide per covered item");
      const items = coveredSlides.map((slide) => {
        const i = Number(slide.dataset.item);
        const item = copy.covered[i];
        const body = $(".c8-body", slide);
        const num = body.appendChild(make("p", "c8-num", String(i + 1)));
        num.setAttribute("aria-hidden", "true");
        const head = body.appendChild(fillKeeping(make("h2", "c8-item t-headline"), item.head, item.keep));
        body.appendChild(make("p", "c8-line t-body t-muted", keep(item.line, item.lineKeep)));
        return head;
      });

      // 8 · Need less, or more: each other plan's name and monthly price from config.ts
      const asks = copy.others.map((other) => {
        const p = plan(other.id);
        const block = $("#c8-s8 .c8-body").appendChild(make("div", "c8-other"));
        const ask = block.appendChild(make("h2", "c8-ask t-headline", other.ask));
        const pick = block.appendChild(make("p", "c8-pick t-lead"));
        pick.append(make("span", "c8-pick-name", p.name), make("span", "c8-price", TWC.monthly(p.monthly, lang)));
        block.appendChild(make("p", "c8-what t-body t-muted", keep(other.what, other.keep)));
        return ask;
      });

      // 9 · CTA, as C1's slide 7: "Free site check:" as the headline, then "DM" + the keyword bubble
      // on its own line (the last word before the keyword is the verb: DM / manda), then the languages
      const cta = TWC.dm("carouselCta", lang);
      const verbAt = cta.before.lastIndexOf(" ");
      const ctaLine = fill($("#c8-s9 .c8-cta"), cta.before.slice(0, verbAt));
      const askDm = $("#c8-s9 .c8-ask-dm");
      askDm.append(make("span", "c8-verb", cta.before.slice(verbAt + 1)), TWC.bubble(cta.keyword));
      if (cta.after) askDm.append(` ${cta.after}`);
      fill($("#c8-s9 .c8-langs"), TWC.t("business.languages"));
      TWC.showRiver(TWC.river($("#c8-s9 .c8-river"), { width: 904, stops: "phone" }));

      document.fonts.ready.then(() => {
        TWC.fit(title, { max: 144, min: 96, maxHeight: 600 });
        // The six items at one size (the size the longest fits at), so the slides match as you swipe.
        // 96 px, not 104, so "booking tested" ends short of the margin, inside the rule's width
        const itemSize = Math.min(...items.map((head) => TWC.fit(head, { max: 96, min: 80, maxHeight: 330 })));
        items.forEach((head) => ((head.style.fontSize = `${itemSize}px`), fitWidth(head, 72)));
        // Slide 8's two questions at the items' size too
        asks.forEach((ask) => (ask.style.fontSize = `${itemSize}px`));
        TWC.fit(ctaLine, { max: 144, min: 96, maxHeight: 460 });
        [title, ctaLine, ...asks].forEach((node) => fitWidth(node, 72));
        // The cover's river sits under the plan name, wherever the hook's last line ends
        const name = $("#c8-s1 .c8-plan-name");
        const nameBottom = name.parentElement.offsetTop + name.offsetTop + name.offsetHeight;
        $("#c8-s1 .c8-river").style.top = `${nameBottom + 48}px`;
        // Stills: one frame per slide, so nothing moves
        window.__timelines["c8"] = gsap.timeline({ paused: true });
      });
    </script>
  </body>
</html>
