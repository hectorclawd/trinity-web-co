<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"es","label":"Español"}]},
    {"id":"guides","type":"boolean","label":"Show safe zones","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- R4 · Demo: Purple Martin Heating & Air. 30 s Reel: 0–4.8 s hook over a small, whole phone under the
         headline (on "It's not a real company" the page flicks up to the demo's own notice bar and a River leader
         points at it); 4.8–26 s the phone grows into place for a scroll-through, a callout as Chris names each thing; 26–30 s the shared end card (the DM ask).
         Demo badge on whenever the phone is. Captures of the built demo at 390×844, DPR 3, in r4/img/; the
         sticky header and call bar are laid over them the way the site behaves (CallBar.astro).
         Render: node scripts/render.mjs r4/r4.html --lang en -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="brand/generated.js"></script>
    <script src="brand/kit.js"></script>
    <link rel="stylesheet" href="brand/kit.css" />
    <style>
      @font-face {
        font-family: "Archivo Variable";
        src: url("brand/fonts/archivo-latin-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Archivo Variable";
        src: url("brand/fonts/archivo-latin-ext-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--limestone);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--font);
      }
      #el-captions,
      #el-end-card {
        position: absolute;
        inset: 0;
      }
      .r4-scene {
        position: absolute;
        inset: 0;
      }

      /* 1 · The hook: under the Demo badge, above the small, whole phone */
      .r4-hook {
        position: absolute;
        left: var(--pad);
        top: 352px;
        width: 904px;
        margin: 0;
      }

      /* The phone is always drawn whole, never cut by a line. Its resting place is 240–880 × 336–1356:
         left of the Reel buttons' column and clear of the captions, which start about y 1376. In the
         hook it sits small under the headline on the same base (it scales from its bottom centre). */
      .r4-window {
        position: absolute;
        inset: 0;
      }
      .r4-rig {
        position: absolute;
        left: 240px;
        top: 336px;
        width: 640px;
        height: 1020px;
        transform-origin: 50% 100%;
      }
      /* A drawn phone: a 3 px Ink ring and a Paper bezel. Flat, no shadow. */
      .r4-phone {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: var(--rule) solid var(--ink);
        border-radius: 56px;
        background: var(--paper);
      }
      /* The screen shows the demo at 390 CSS px wide: 620 px here, so 1 CSS px = 1.59 px */
      .r4-screen {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 620px;
        height: 1000px;
        overflow: hidden;
        border-radius: 46px;
        background: #fffaf3;
      }
      .r4-page,
      .r4-pin,
      .r4-bar {
        position: absolute;
        left: 0;
        width: 620px;
      }
      .r4-page {
        top: 0;
      }
      .r4-page img,
      .r4-pin img,
      .r4-bar img {
        position: absolute;
        left: 0;
        display: block;
        width: 620px;
        height: auto;
      }
      .r4-pin {
        top: 0;
        height: 111px;
      }
      .r4-bar {
        bottom: 0;
        height: 116px;
      }

      /* The Demo badge: top right, aligned with the phone's right edge, on screen the whole time
         the phone is */
      .r4-badge {
        position: absolute;
        right: 200px;
        top: 260px;
      }

      /* 2 · Callouts: a short Ink label above the phone and a River leader down the gutter on
         the phone's left, then in to the thing Chris names */
      .r4-label {
        position: absolute;
        left: var(--pad);
        top: 260px;
        margin: 0;
        font-size: var(--fs-body);
        line-height: 1.12;
        font-weight: 700;
        font-stretch: 108%;
        letter-spacing: -0.005em;
        white-space: nowrap;
      }
      .r4-leaders {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="r4" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div class="twc-bg"></div>
      <audio id="r4-voiceover" src="r4/audio/r4-en.mp3" data-start="0" data-duration="25.36" data-track-index="4" data-volume="1"></audio>
      <section id="r4-demo" class="clip r4-scene" data-start="0" data-duration="26" data-track-index="1">
        <div class="r4-window">
          <div class="r4-rig" data-layout-allow-overflow>
            <div class="r4-phone"></div>
            <div class="r4-screen">
              <div class="r4-page">
                <img src="r4/img/page-1.jpg" width="620" height="2391" alt="" />
                <img src="r4/img/page-2.jpg" width="620" height="2391" alt="" />
                <img src="r4/img/page-3.jpg" width="620" height="2391" alt="" />
                <img src="r4/img/page-4.jpg" width="620" height="2391" alt="" />
              </div>
              <div class="r4-pin"><img src="r4/img/header.jpg" width="620" height="111" alt="" /></div>
              <div class="r4-bar"><img src="r4/img/call-bar.jpg" width="620" height="116" alt="" /></div>
            </div>
          </div>
        </div>
        <svg class="r4-leaders" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="r4-labels"></div>
        <div class="r4-badge"></div>
      </section>
      <section id="r4-open" class="clip r4-scene" data-start="0" data-duration="5.4" data-track-index="2">
        <h1 class="r4-hook t-headline"></h1>
      </section>
      <div id="el-captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="26" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="el-end-card" data-composition-id="end-card" data-composition-src="compositions/end-card.html"
        data-start="26" data-duration="4" data-track-index="5" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      // On-screen words: the plan's hook, shortened; callout labels that add to what Chris says rather
      // than repeat it. English only for now: add `es` once Hector has checked the Spanish.
      const COPY = {
        en: {
          hook: { before: "We built a site for a", mark: "made-up", after: "AC company" },
          labels: {
            bar: "Tap to call or text",
            steps: "The visit in three steps",
            extras: "Every other service, one list",
            area: "Service area, by name",
          },
          pageAlt: "the demo’s homepage on a phone",
        },
      };
      // Chris's word timings (r4/audio/r4-en.words.json), inlined: the render never fetches a local file
      const WORDS = [
        ["This",0,0.197], ["is",0.255,0.313], ["Purple",0.372,0.65], ["Martin",0.685,0.998], ["Heating",1.149,1.544], ["and",1.695,1.892], ["Air.",2.009,2.589], ["It's",2.914,3.123],
        ["not",3.158,3.286], ["a",3.32,3.344], ["real",3.425,3.622], ["company.",3.68,4.168], ["Trinity",4.772,5.108], ["Web",5.155,5.294], ["Co.",5.341,5.492], ["built",5.7,5.921],
        ["it",5.956,6.014], ["as",6.06,6.142], ["a",6.2,6.223], ["demo",6.281,6.536], ["to",6.594,6.653], ["show",6.699,6.85], ["what",6.873,6.978], ["a",7.012,7.036],
        ["site",7.105,7.361], ["for",7.384,7.465], ["your",7.5,7.593], ["business",7.639,7.941], ["could",7.976,8.104], ["look",8.139,8.278], ["like.",8.324,8.673], ["The",9.114,9.23],
        ["call",9.276,9.451], ["and",9.485,9.555], ["text",9.578,9.764], ["buttons",9.799,10.054], ["stay",10.089,10.263], ["at",10.286,10.344], ["the",10.379,10.449], ["bottom",10.519,10.762],
        ["of",10.797,10.844], ["the",10.867,10.937], ["screen,",10.96,11.482], ["so",11.923,12.063], ["customers",12.121,12.539], ["never",12.655,12.957], ["hunt",13.027,13.189], ["for",13.236,13.328],
        ["your",13.375,13.479], ["number.",13.526,13.979], ["\"How",14.582,14.78], ["a",14.838,14.861], ["visit",14.954,15.244], ["works\"",15.302,15.952], ["answers",16.161,16.533], ["what",16.568,16.684],
        ["people",16.73,16.986], ["ask",17.032,17.206], ["before",17.253,17.485], ["they",17.52,17.624], ["call.",17.671,18.135], ["Services",18.739,19.226], ["fit",19.284,19.424], ["on",19.47,19.528],
        ["one",19.598,19.726], ["screen.",19.76,20.202], ["And",20.411,20.538], ["it's",20.585,20.701], ["fast",20.759,21.049], ["on",21.107,21.177], ["a",21.223,21.246], ["phone.",21.293,21.711],
        ["Want",22.222,22.442], ["one",22.5,22.628], ["like",22.663,22.86], ["it?",22.895,23.127], ["DM",23.824,24.149], ["us",24.265,24.393], ["\"check.\"",24.52,25.356],
      ].map(([text, start, end]) => ({ text, start, end }));
      const { lang } = TWC.init(window.__hyperframes.getVariables(), { transcript: WORDS });
      if (!COPY[lang]) throw new Error(`R4 has no "${lang}" copy or voiceover yet. Add both once Hector has checked the Spanish.`);
      const copy = COPY[lang];
      const motion = TWC.motion;
      const $ = (s) => document.querySelector(s);
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      };

      /* ---------- The demo page, in CSS px at 390 wide (measured from the built site) ---------- */
      const K = 620 / 390; // frame px per CSS px on the phone's screen
      const VIEW = 1000 / K; // the screen shows 629 CSS px of the page
      const TILE = 1500; // each page-N.jpg is 1,500 CSS px, plus 4 px of overlap into the next
      const PAGE = {
        notice: 31.3, // the demo notice above the sticky header: the header pins once it's gone
        heroButtons: 568.8, // bottom of the hero's call buttons: the call bar shows once they're off screen
        callBand: 5005.4, // the call band's buttons, which hide the call bar again (never reached here)
        header: 70,
        bar: 73,
      };
      // Where the page sits for each beat (scroll position, CSS px) and the thing each callout points at
      const STOP = {
        top: 0,
        hero: 420, // the hero's buttons and its drawing; the call bar is still down
        services: 880, // "What we do" just under the header
        heating: 1290,
        steps: 2113, // "How a visit works" and its steps
        extras: 1518, // "We also do": the whole compact list fits between the header and the call bar
        area: 3912, // "Hours and service area"
      };
      const TARGET = {
        bar: VIEW - PAGE.bar / 2, // the call bar's buttons, pinned to the screen's bottom
        steps: 2205.3 + 16.1 - STOP.steps, // the "How a visit works" heading
        extras: 1592 + 12 - STOP.extras, // the "We also do" heading
        area: 4052.5 + 14.4 - STOP.area, // the first line of "We serve Lake Highlands, …"
      };

      /* ---------- Frame geometry ---------- */
      const RIG = { top: 336, left: 240, width: 640, height: 1020 }; // the phone at rest (bottom at y 1356)
      const SCREEN = { x: RIG.left + 10, y: RIG.top + 10 };
      const frameY = (cssY) => SCREEN.y + cssY * K;
      const LEADER = { x: 100, top: 326, end: SCREEN.x + 12, radius: 18 };

      // Images: the page in tiles, stacked with a 4 px overlap; the header and the call bar on top
      const tiles = [...document.querySelectorAll(".r4-page img")];
      tiles.forEach((img, i) => (img.style.top = `${i * TILE * K}px`));
      $(".r4-pin img").style.top = "0px";
      $(".r4-bar img").style.top = "0px";
      const demoName = TWC.t("demos.purpleMartin.name");
      $(".r4-page img").alt = `${demoName}, ${copy.pageAlt}`;
      // Hook, with "made-up" in River so the honest word is the one that stands out
      const hook = $(".r4-hook");
      hook.append(`${copy.hook.before} `, make("span", "t-river", copy.hook.mark), ` ${copy.hook.after}`);

      // Badge
      const badge = TWC.badge("demo", lang);
      $(".r4-badge").appendChild(badge);

      // Callouts: a label and a leader each
      const svg = $(".r4-leaders");
      const SVG_NS = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs) => {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        svg.appendChild(node);
        return node;
      };
      // A River leader down the gutter and in to the screen at y, ending on a dot
      const leader = (y, top = LEADER.top, end = LEADER.end) => {
        const { x, radius: r } = LEADER;
        const line = svgEl("path", {
          d: `M ${x} ${top} V ${y - r} Q ${x} ${y} ${x + r} ${y} H ${end}`,
          fill: "none",
          stroke: "var(--river)",
          "stroke-width": 3,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
        });
        const dot = svgEl("circle", { cx: end, cy: y, r: 7, fill: "var(--river)" });
        return { line, dot };
      };
      const callouts = Object.fromEntries(
        Object.entries(TARGET).map(([id, cssY]) => {
          const { line, dot } = leader(Math.round(frameY(cssY) * 10) / 10);
          const label = make("p", "r4-label", copy.labels[id]);
          $(".r4-labels").appendChild(label);
          return [id, { line, dot, label }];
        }),
      );

      document.fonts.ready.then(() => {
        TWC.fit(hook, { max: 104, min: 84, maxHeight: 400 });
        // Labels stay on one line, clear of the badge
        const room = badge.getBoundingClientRect().left - 32 - 88;
        Object.values(callouts).forEach(({ label }) => {
          for (let size = 42; size > 36 && label.offsetWidth > room; size -= 1) label.style.fontSize = `${size - 1}px`;
        });
        // Scene 1: the phone sits whole under the headline, scaled from its bottom centre
        const hookBottom = hook.offsetTop + hook.offsetHeight;
        const small = Math.min(0.6, (RIG.top + RIG.height - hookBottom - 72) / RIG.height);
        const smallX = (x) => RIG.left + RIG.width / 2 + (x - RIG.left - RIG.width / 2) * small;
        const smallY = (y) => RIG.top + RIG.height - (RIG.top + RIG.height - y) * small;
        // Its leader: from under the headline, down the gutter to the demo's own notice bar
        const notice = leader(smallY(frameY(PAGE.notice / 2)), hookBottom + 36, smallX(LEADER.end));
        [...Object.values(callouts), notice].forEach(({ line }) => {
          const len = line.getTotalLength();
          line.dataset.len = len;
          line.style.strokeDasharray = `${len} ${len + 6}`;
          line.style.strokeDashoffset = len + 3;
        });

        const tl = gsap.timeline({ paused: true });
        const rig = $(".r4-rig");
        const page = $(".r4-page");
        const pin = $(".r4-pin");
        const bar = $(".r4-bar");
        const barHidden = PAGE.bar * K;
        const siteEase = TWC.bezier(0.25, 0.1, 0.25, 1); // CSS "ease", the call bar's own transition

        // The page opens scrolled a little way down, the sticky header (the business name) pinned
        const OPEN = 300;
        gsap.set(page, { y: -OPEN * K });
        gsap.set(pin, { opacity: 1 });
        gsap.set(bar, { y: barHidden });

        /* Scrolls: each is a flick, then the page glides to a stop on the momentum spring (a little
           settle at the end). Long ones get more time, like a harder flick. The trip back to the top
           settles without a bounce, since the page can't scroll past its top. */
        let scroll = OPEN;
        let pinned = true;
        let barUp = false;
        function flick(at, to, { duration = motion.momentum.duration * 1.6, ease = motion.momentum.ease } = {}) {
          const from = scroll;
          tl.fromTo(page, { y: -from * K }, { y: -to * K, duration, ease, immediateRender: false }, at);
          // When the page passes a threshold: the first moment the eased scroll reaches it
          const when = (threshold) => {
            const goal = (threshold - from) / (to - from);
            let lo = 0;
            let hi = 1;
            for (let i = 1; i <= 400; i++) {
              if (ease(i / 400) >= goal) {
                lo = (i - 1) / 400;
                hi = i / 400;
                break;
              }
            }
            for (let i = 0; i < 30; i++) {
              const mid = (lo + hi) / 2;
              if (ease(mid) >= goal) hi = mid;
              else lo = mid;
            }
            return at + hi * duration;
          };
          // The sticky header pins once the demo notice has scrolled away
          if ((to > PAGE.notice) !== pinned) {
            pinned = to > PAGE.notice;
            tl.set(pin, { opacity: pinned ? 1 : 0 }, when(PAGE.notice));
          }
          // The call bar slides up once the hero's call buttons are off screen, and back down when
          // they return (or when the call band comes on screen, which this Reel never reaches)
          const up = to >= PAGE.heroButtons && to + VIEW < PAGE.callBand;
          if (up !== barUp) {
            barUp = up;
            const at2 = when(PAGE.heroButtons);
            tl.fromTo(bar, { y: up ? barHidden : 0 }, { y: up ? 0 : barHidden, duration: 0.2, ease: siteEase, immediateRender: false }, at2);
          }
          scroll = to;
          return at + duration;
        }

        function drawLeader({ line, dot }, at) {
          const len = +line.dataset.len;
          const drawFor = Math.min(0.75, 0.32 + len / 2400);
          tl.fromTo(line, { strokeDashoffset: len + 3 }, { strokeDashoffset: 0, duration: drawFor, ease: motion.draw }, at + 0.08);
          tl.fromTo(dot, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: motion.snappy.duration, ease: motion.snappy.ease }, at + 0.08 + drawFor - 0.06);
        }
        function retractLeader({ line, dot }, at) {
          tl.to(dot, { scale: 0, duration: 0.16, ease: "power1.in" }, at);
          tl.to(line, { strokeDashoffset: +line.dataset.len + 3, duration: 0.3, ease: "power2.in" }, at + 0.04);
        }
        function showCallout(id, at) {
          TWC.rise(tl, callouts[id].label, at, { y: 14, spring: motion.snappy });
          drawLeader(callouts[id], at);
        }
        // Leaves the way it came: the dot first, the line draws back up, the label sinks away
        function hideCallout(id, at) {
          retractLeader(callouts[id], at);
          tl.to(callouts[id].label, { opacity: 0, y: 14, duration: 0.24, ease: "power1.in" }, at + 0.06);
        }

        /* ---- 1 · Hook (0–4.8 s): the badge, the headline, and the small phone rising under it on the
           business name (the sticky header) ---- */
        TWC.rise(tl, badge, 0, { y: 14, spring: motion.snappy });
        TWC.rise(tl, hook, 0.15);
        gsap.set(rig, { scale: small });
        TWC.rise(tl, rig, 0.32, { y: 40 });
        // "It's not a real company." (2.914): the page flicks up to the demo's own notice bar
        // ("Demo site: a made-up business") and a River leader runs from the headline down to it
        const landed = flick(2.914, STOP.top);
        drawLeader(notice, Math.max(3.2, landed - 0.8)); // lands on "real", while the page settles
        // "Trinity Web Co. built it…" (4.772): the headline and its leader go, the phone grows into place
        retractLeader(notice, 4.6);
        tl.to(hook, { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.66);
        tl.to(hook, { y: -36, duration: motion.move.duration, ease: motion.move.ease }, 4.66);
        tl.fromTo(rig, { scale: small }, { scale: 1, duration: motion.move.duration * 1.2, ease: motion.move.ease, immediateRender: false }, 4.772);
        // "…to show what a site for your business could look like" (6.699): down past the hero's
        // headline to its buttons, short of where the call bar takes over

        /* ---- 2 · Scroll-through (4.8–26 s) ---- */
        flick(6.699, STOP.hero);
        // A flick past the hero: its call buttons leave the screen and the call bar slides up
        flick(9.5, STOP.services);
        showCallout("bar", 9.95);
        // "…so customers never hunt for your number" (11.923): keep scrolling; the bar stays put
        flick(11.923, STOP.heating);
        // "How a visit works" (14.582)
        hideCallout("bar", 14.4);
        flick(14.582, STOP.steps);
        showCallout("steps", 15.0);
        // "Services fit on one screen" (18.739): back up to the compact list
        hideCallout("steps", 18.739);
        flick(18.739, STOP.extras);
        showCallout("extras", 19.12);
        // "And it's fast on a phone" (20.411): one long flick down to the service area
        hideCallout("extras", 20.24);
        // The label waits until the page has landed and "phone." has ended (21.711)
        const areaLanded = flick(20.411, STOP.area, { duration: motion.momentum.duration * 2.2 });
        showCallout("area", Math.max(areaLanded, 21.75));
        // "Want one like it?": back to the top of the page, where it started
        hideCallout("area", 23.0);
        flick(23.15, STOP.top, { duration: motion.move.duration * 2.1, ease: motion.move.ease });
        // The phone drops back as it fades (the way it came, clear of the captions), then the badge
        // goes, just before the end card (26 s)
        tl.to(rig, { opacity: 0, duration: 0.3, ease: "power1.in" }, 25.1);
        tl.to(rig, { y: 12, duration: 0.34, ease: "power2.in" }, 25.1); // stays above y 1370
        tl.to(badge, { opacity: 0, y: 14, duration: 0.2, ease: "power1.in" }, 25.75);

        window.__timelines["r4"] = tl;
      });
    </script>
