<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"es","label":"Español"}]},
    {"id":"guides","type":"boolean","label":"Show safe zones","default":false},
    {"id":"tone","type":"enum","label":"Background","default":"light","options":[{"value":"light","label":"Limestone"},{"value":"paper","label":"Paper"},{"value":"deep","label":"River deep"}]},
    {"id":"brand","type":"boolean","label":"Show the brand line","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- The story frame (1080×1920): background and a small brand line at the foot of the safe
         area. A story set's entry file mounts it under its frames and puts content between
         y 250 and y 1570. Poll, question and link stickers are added in the Instagram app, so
         leave room for them; with guides on, the frame marks a sticker area. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="brand/kit.css" />
      <style>
        @font-face {
          font-family: "Archivo Variable";
          src: url("brand/fonts/archivo-latin-wdth-normal.woff2") format("woff2-variations");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: var(--font);
        }
        #root.sf-deep {
          color: var(--paper);
        }
        .sf-brand {
          position: absolute;
          left: var(--pad);
          bottom: calc(var(--safe-bottom) + 40px);
          display: flex;
          align-items: center;
          gap: 18px;
        }
        .sf-brand svg {
          display: block;
        }
        .sf-handle {
          font-size: 34px;
          font-stretch: 116%;
          font-weight: 760;
        }
        .sf-sticker {
          position: absolute;
          left: 140px;
          right: 140px;
          top: 1060px;
          height: 330px;
          border: 3px dashed rgba(214, 51, 108, 0.9);
          border-radius: 36px;
          background: rgba(214, 51, 108, 0.08);
          color: rgb(160, 30, 80);
          font: 650 28px/1.2 var(--font);
          display: grid;
          place-items: center;
        }
      </style>

      <div id="root" data-composition-id="story-frame" data-width="1080" data-height="1920">
        <div class="twc-bg"></div>
        <div class="sf-brand"><span class="sf-handle"></span></div>
      </div>

      <script src="brand/generated.js"></script>
      <script src="brand/kit.js"></script>
      <script>
        (function () {
          const own = window.__hyperframes.getVariables();
          const { guides } = TWC.vars(own);
          const root = [...document.querySelectorAll('[data-composition-id="story-frame"]')].pop();
          const $ = (s) => root.querySelector(s);
          const deep = own.tone === "deep";
          root.classList.toggle("sf-deep", deep);
          $(".twc-bg").classList.toggle("twc-bg--deep", deep);
          $(".twc-bg").classList.toggle("twc-bg--paper", own.tone === "paper");

          if (own.brand === false) $(".sf-brand").remove();
          else {
            const logo = TWC.logo($(".sf-brand"), { width: 66, color: deep ? "var(--paper)" : "var(--river-deep)" });
            $(".sf-brand").insertBefore(logo, $(".sf-handle"));
            TWC.showLogo(logo);
            $(".sf-handle").textContent = TWC.t("business.handle");
          }
          if (guides) {
            const layer = TWC.guides(root, "story");
            layer.setAttribute("data-layout-ignore", "");
            const sticker = document.createElement("div");
            sticker.className = "sf-sticker";
            sticker.textContent = "Sticker area (poll, question or link, added in the app)";
            layer.appendChild(sticker);
          }

          window.__timelines["story-frame"] = gsap.timeline({ paused: true });
        })();
      </script>
    </template>
  </body>
</html>
