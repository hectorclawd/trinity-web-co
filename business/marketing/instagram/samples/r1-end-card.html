<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"es","label":"Español"}]},
    {"id":"guides","type":"boolean","label":"Show safe zones","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Sample: R1's last 4 seconds, the shared end card on its own.
         Render: node scripts/render.mjs samples/r1-end-card.html --lang es -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="brand/generated.js"></script>
    <script src="brand/kit.js"></script>
    <link rel="stylesheet" href="brand/kit.css" />
    <style>
      @font-face {
        font-family: "Archivo Variable";
        src: url("brand/fonts/archivo-latin-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--limestone);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #el-end-card {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="r1-end-card" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div
        id="el-end-card"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      TWC.init(window.__hyperframes.getVariables());
      window.__timelines["r1-end-card"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
